<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hva brannen faktisk tok — Fontainebleau, juli 2026</title>
<meta name="description" content="Hvilke buldresektorer i Fontainebleau brant i juli 2026, og hvilke er bare stengt? Offisiell brannflate fra Copernicus EMS lagt over hver enkelt blokk i Boolders datasett.">
<meta property="og:title" content="Hva brannen faktisk tok — Fontainebleau, juli 2026">
<meta property="og:description" content="926 hektar brant, fordelt på 76 atskilte flater. 2 104 av 19 137 blokkproblemer ligger innenfor brannflaten.">
<meta property="og:type" content="website">
<!-- Ikonet ligger som data-URI. Uten det ber nettleseren om /favicon.ico og får 404. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231C1815'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23C8492A'/%3E%3C/svg%3E">
<!-- Leaflet og skriftene ligger lokalt. Da faller ikke kartet bort om et CDN
     blokkeres, og ingen tredjepart ser hvem som leser sida. -->
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
:root{
  --soot:#1C1815; --soot2:#272119; --soot3:#332B22;
  --gres:#E2DCCC; --gres2:#D0C8B4; --craie:#F7F4EB;
  /* --ash2 var #6B6357, som gir 2,98:1 mot bakgrunnen — under kravet på 4,5:1.
     Fargen bærer faktakortenes overskrifter, alle seksjonstitler og bunnteksten. */
  --ash:#9A9084; --ash2:#8A8175;
  --braise:#C8492A; --lichen:#6E8C58;
  --disp:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--soot);color:var(--craie);font:16px/1.6 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
a{color:inherit}
[id]{scroll-margin-top:76px}

/* ---------- toppstripe med meny ---------- */
.topbar{position:sticky;top:0;z-index:1200;/* over Leafletkontrollene, som ligger på 1000 */background:rgba(28,24,21,.94);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--soot3)}
.topbar-in{display:flex;align-items:center;gap:16px;min-height:52px}
.brand{font:500 11px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--craie);
  text-decoration:none;white-space:nowrap}
.brand i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--braise);margin-right:9px}
.nav{margin-left:auto;display:flex;gap:4px}
.nav a{font:500 11px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ash);
  text-decoration:none;padding:9px 10px;border-radius:2px;transition:color 140ms,background 140ms}
.nav a:hover,.nav a:focus-visible{color:var(--craie);background:var(--soot2)}
.lang{font:500 11px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ash);
  background:none;border:1px solid var(--soot3);border-radius:2px;padding:8px 10px;margin-left:14px;
  cursor:pointer;white-space:nowrap;transition:color 140ms,border-color 140ms}
.lang:hover{color:var(--craie);border-color:var(--ash2)}
.lang:focus-visible{outline:2px solid var(--braise);outline-offset:2px}
.burger{display:none;width:38px;height:34px;padding:9px 7px;background:none;cursor:pointer;
  border:1px solid var(--soot3);border-radius:2px}
.burger span{display:block;height:1.5px;background:var(--craie);transition:transform 180ms,opacity 140ms}
.burger span+span{margin-top:4px}
.burger:focus-visible{outline:2px solid var(--braise);outline-offset:2px}
.topbar.open .burger span:nth-child(1){transform:translateY(5.5px) rotate(45deg)}
.topbar.open .burger span:nth-child(2){opacity:0}
.topbar.open .burger span:nth-child(3){transform:translateY(-5.5px) rotate(-45deg)}
@media(max-width:760px){
  .burger{display:block;margin-left:12px}
  .lang{margin-left:auto}
  .nav{display:none;position:absolute;left:0;right:0;top:100%;margin:0;flex-direction:column;gap:0;
    background:var(--soot);border-bottom:1px solid var(--soot3);padding:6px 20px 12px}
  .topbar.open .nav{display:flex}
  .nav a{padding:12px 0;border-bottom:1px solid #241F19}
}

/* ---------- hero ---------- */
.hero{padding:46px 0 34px}
.kicker{font:500 11px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--ash);
  display:flex;gap:16px;flex-wrap:wrap;margin:0 0 22px}
.kicker span{display:flex;gap:7px;align-items:center}
.kicker i{width:6px;height:6px;border-radius:50%;background:var(--braise);display:block;font-style:normal}
h1{font:800 clamp(38px,7.2vw,82px)/0.94 var(--disp);letter-spacing:-.035em;margin:0 0 18px;max-width:16ch}
h1 em{font-style:normal;color:var(--braise)}
.stand{font-size:clamp(15px,1.6vw,18px);line-height:1.5;color:#CFC7B8;max-width:60ch;margin:0 0 34px}

/* ---------- signaturgrafikk: forholdsbandet ---------- */
.ratio{margin:0 0 12px}
.ratio-bar{display:flex;height:64px;border:1px solid var(--soot3);background:var(--soot2);overflow:hidden}
.ratio-bar div{position:relative;transition:width 900ms cubic-bezier(.2,.8,.2,1)}
.ratio-burn{background:var(--braise);width:0}
.ratio-safe{background:var(--lichen);width:0}
.ratio-key{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:11px}
.ratio-key div{font:400 13px/1.45 var(--body);color:var(--ash);max-width:44ch}
.ratio-key b{display:block;font:500 15px/1.2 var(--mono);color:var(--craie);letter-spacing:-.01em;margin-bottom:3px}
.ratio-key .sw{display:inline-block;width:9px;height:9px;margin-right:7px;vertical-align:0}
.ratio-note{font:400 13px/1.5 var(--body);color:var(--ash2);margin:16px 0 0;max-width:66ch}

/* ---------- faktastripe ---------- */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;
  background:var(--soot3);border-top:1px solid var(--soot3);border-bottom:1px solid var(--soot3);margin:34px 0 0}
.facts div{background:var(--soot);padding:16px 0 18px}
.facts dt{font:500 10.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ash2);margin:0 0 8px}
.facts dd{margin:0;font:500 25px/1 var(--mono);letter-spacing:-.02em}
.facts dd small{display:block;font:400 12px/1.45 var(--body);color:var(--ash);letter-spacing:0;margin-top:7px}

/* ---------- kart ---------- */
.sheet{background:var(--gres);color:#20201C;margin:40px 0 0;border-radius:2px}
.sheet-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:11px 14px;border-bottom:1px solid var(--gres2)}
.sheet-top label{font:500 10.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#5D574A}
select{font:400 13px/1 var(--mono);padding:6px 8px;border:1px solid var(--gres2);background:var(--craie);color:#20201C;border-radius:2px}
#tilestate{font:400 12px/1 var(--mono);color:#5D574A;margin-left:auto}
.dotlive{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
#map{height:min(72vh,660px);background:#CFC8B8}
@media(max-width:760px){#map{height:56vh}}

/* ---------- valgt sektor ---------- */
.picked{border-top:1px solid var(--gres2);padding:20px 22px 24px;min-height:132px}
.picked .empty{font:400 14px/1.5 var(--body);color:#5A5449;margin:0}
.pname{font:600 clamp(24px,3.4vw,34px)/1.05 var(--disp);letter-spacing:-.03em;margin:0 0 6px}
.pmeta{font:400 11.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#6B6558;margin:0 0 14px}
.tag{display:inline-block;font:500 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  padding:5px 9px;border:1px solid currentColor;border-radius:2px;margin:0 6px 14px 0}
.pcols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:0 34px}
@media(max-width:700px){.pcols{grid-template-columns:1fr;gap:16px}}
.gauge{height:9px;background:#C2BAA6;margin:0 0 10px;position:relative;overflow:hidden}
.gauge i{display:block;height:100%;transition:width 350ms ease}
.pcols p{font:400 14px/1.55 var(--body);margin:0 0 9px;color:#2C2B25}
.pcols p.dim{color:#5D574A;font-size:13.5px}
.pcols b{font-weight:600}
.blink{display:inline-flex;align-items:center;gap:7px;font:500 11.5px/1 var(--mono);letter-spacing:.08em;
  text-transform:uppercase;text-decoration:none;color:#20201C;background:var(--craie);border:1px solid #C2BAA6;
  border-radius:2px;padding:8px 11px;margin:0 0 14px;transition:border-color 140ms,color 140ms}
.blink:hover,.blink:focus-visible{border-color:var(--braise);color:var(--braise)}
.blink:focus-visible{outline:2px solid var(--braise);outline-offset:2px}

/* ---------- filtre ---------- */
.filters{display:flex;flex-wrap:wrap;gap:7px;padding:16px 0 0}
.chip{font:500 12px/1 var(--mono);letter-spacing:.02em;border:1px solid var(--soot3);background:transparent;
  color:var(--ash);padding:8px 12px;cursor:pointer;border-radius:2px;display:flex;gap:8px;align-items:center;
  transition:border-color 140ms,color 140ms}
.chip:hover{border-color:var(--ash2);color:var(--craie)}
.chip[aria-pressed="true"]{background:var(--craie);color:var(--soot);border-color:var(--craie)}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip:focus-visible{outline:2px solid var(--braise);outline-offset:2px}

/* ---------- nedre rutenett ---------- */
.grid{display:grid;grid-template-columns:minmax(0,1.85fr) minmax(0,1fr);gap:42px;margin:52px 0 0}
@media(max-width:940px){.grid{grid-template-columns:1fr;gap:34px}}
.sec-h{font:500 10.5px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ash2);
  margin:0 0 6px;padding-bottom:10px;border-bottom:1px solid var(--soot3)}
.sec-note{font:400 13px/1.5 var(--body);color:var(--ash);margin:10px 0 16px}

/* tabell */
/* ---------- klyngene, sammenslåtte ---------- */
.clus{display:grid;grid-template-columns:13px minmax(0,1fr) auto;gap:12px;align-items:baseline;width:100%;
  text-align:left;background:none;border:0;border-bottom:1px solid var(--soot3);cursor:pointer;
  margin:22px 0 0;padding:13px 4px 11px;color:var(--ash);transition:background 120ms,color 120ms}
.clus:hover,.clus:focus-visible{background:var(--soot2);color:var(--craie);outline:none}
.clus:focus-visible{outline:2px solid var(--braise);outline-offset:-2px}
.clus .chev{align-self:center;width:13px;height:13px;position:relative}
.clus .chev::before{content:"";position:absolute;left:2px;top:3.5px;width:6px;height:6px;
  border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;
  transform:rotate(-45deg);transition:transform 160ms}
.clus[aria-expanded="true"] .chev::before{transform:rotate(45deg)}
.clus .g{font:500 11.5px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--craie)}
.clus .n{display:block;font:400 12.5px/1.45 var(--body);letter-spacing:0;text-transform:none;
  color:var(--ash2);margin-top:4px}
.clus .sum{text-align:right;font:400 12.5px/1.45 var(--body);color:var(--ash);white-space:nowrap}
.clus .sum b{display:block;font:500 13px/1.2 var(--mono);color:var(--craie);letter-spacing:-.01em;margin-bottom:4px}
.clus .sum .cbar{display:block;width:88px;height:4px;background:#2C261E;margin:6px 0 0 auto}
.clus .sum .cbar i{display:block;height:100%;background:var(--braise)}
@media(max-width:560px){
  .clus{grid-template-columns:13px minmax(0,1fr);gap:9px}
  .clus .sum{grid-column:2;text-align:left;white-space:normal;margin-top:7px}
  .clus .sum .cbar{margin-left:0}
}
.grp[hidden]{display:none}

.tallyrow{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin:8px 0 0}
.tallyrow .tally{margin:0}
.alle{margin-left:auto;background:none;border:0;padding:2px 0;cursor:pointer;
  font:400 12.5px/1.5 var(--body);color:var(--ash);border-bottom:1px solid var(--soot3)}
.alle:hover{color:var(--craie);border-color:var(--ash2)}
.alle:focus-visible{outline:2px solid var(--braise);outline-offset:2px}
.alle[hidden]{display:none}
.row{display:grid;grid-template-columns:11px minmax(0,1fr) 86px 58px 74px;gap:13px;align-items:center;width:100%;
  text-align:left;background:none;border:0;border-bottom:1px solid #241F19;padding:11px 4px;cursor:pointer;
  font:inherit;color:var(--craie);transition:background 120ms}
@media(max-width:560px){.row{grid-template-columns:11px minmax(0,1fr) 78px 52px;gap:10px}.row .mini{display:none}}
.row:hover,.row:focus-visible{background:var(--soot2);outline:none}
.row[aria-current="true"]{background:var(--soot3)}
.row .dot{width:9px;height:9px;border-radius:50%}
.row .nm{font:400 14.5px/1.3 var(--body);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .cnt{font:400 12px/1 var(--mono);color:var(--ash);text-align:right;letter-spacing:-.02em}
.row .pct{font:500 13px/1 var(--mono);text-align:right}
.row .pct.none{color:var(--ash2);font-weight:400}
.row .mini{height:5px;background:#2C261E;position:relative}
.row .mini i{display:block;height:100%}
.row.hidden{display:none}

/* ---------- søk og sortering ---------- */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 4px}
.tools input{flex:1 1 190px;min-width:0;font:400 14px/1 var(--body);padding:9px 11px;border-radius:2px;
  border:1px solid var(--soot3);background:var(--soot2);color:var(--craie)}
.tools input::placeholder{color:var(--ash2)}
.tools input:focus-visible{outline:2px solid var(--braise);outline-offset:1px;border-color:var(--braise)}
.tools label{font:500 10.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ash2)}
/* Etiketten skal aldri bli stående igjen på linja over nedtrekkslista. */
.sortwrap{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.tools select{background:var(--soot2);color:var(--craie);border-color:var(--soot3)}
.tally{font:400 12.5px/1.5 var(--body);color:var(--ash);min-height:19px}
.nohit{font:400 14px/1.5 var(--body);color:var(--ash);padding:22px 4px}

/* ---------- endringslogg ---------- */
/* display:flex slår UA-regelen for [hidden], så den må sies eksplisitt — ellers
   står en tom rød stripe der helt til forbudsdatoen er passert. */
.warn[hidden]{display:none}
.warn{display:flex;gap:11px;align-items:flex-start;margin:0 0 30px;padding:13px 15px;border-radius:2px;
  background:rgba(200,73,42,.13);border:1px solid rgba(200,73,42,.5);
  font:400 13.5px/1.5 var(--body);color:#EBD8CF;max-width:74ch}
.warn::before{content:"";flex:0 0 8px;height:8px;border-radius:50%;background:var(--braise);margin-top:7px}
.tl{list-style:none;padding:0;margin:14px 0 0}
.tl li{position:relative;padding:0 0 20px 21px;border-left:1px solid var(--soot3)}
.tl li:last-child{border-left-color:transparent;padding-bottom:2px}
.tl li::before{content:"";position:absolute;left:-4.5px;top:4px;width:8px;height:8px;border-radius:50%;
  background:var(--k,var(--ash2));box-shadow:0 0 0 3px var(--soot)}
.tl .d{font:500 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ash2)}
.tl .ny{display:inline-block;margin-left:8px;padding:2px 6px;border-radius:2px;letter-spacing:.1em;
  background:var(--braise);color:var(--craie)}
.tl .t{font:500 14px/1.35 var(--body);color:var(--craie);margin:7px 0 4px}
.tl .b{font:400 13px/1.55 var(--body);color:var(--ash);margin:0}
.tl .k{display:inline-block;margin-top:7px;font:400 11.5px/1.4 var(--mono);color:var(--ash2);
  text-decoration:none;border-bottom:1px solid var(--soot3)}
.tl .k:hover{color:var(--craie);border-color:var(--ash2)}

/* aside */
.leg{display:flex;gap:11px;margin:0 0 13px}
.leg .sw{flex:0 0 11px;height:11px;border-radius:50%;margin-top:5px}
.leg b{display:block;font:500 13px/1.35 var(--body);color:var(--craie);font-weight:500}
.leg span{font:400 12.5px/1.5 var(--body);color:var(--ash)}
.shapes{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px 26px;margin:16px 0 34px}
.shp{display:flex;gap:11px;margin:0 0 13px}
.shapes .shp{margin:0}
.shp .k{flex:0 0 26px;height:19px;margin-top:3px;border-radius:2px}
.shp .k.burn{background:var(--braise);opacity:.85}
.shp .k.forest{background:rgba(110,140,88,.28);border:1px solid var(--lichen)}
.shp .k.dot{display:flex;align-items:center;justify-content:center;background:none}
.shp .k.dot i{width:11px;height:11px;border-radius:50%;background:var(--braise);border:2px solid var(--gres)}
.shp .k.stein{display:flex;align-items:center;justify-content:center;gap:4px;background:none}
.shp .k.stein i{width:5px;height:5px;border-radius:50%;background:#2F2A24;box-shadow:0 0 0 1px var(--gres)}
.shp .k.stein i.b{background:#FFD24A}
details{border-top:1px solid var(--soot3);padding:14px 0 0;margin:26px 0 0}
summary{cursor:pointer;font:500 10.5px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ash2)}
summary:hover{color:var(--craie)}
details .body{font:400 13.5px/1.6 var(--body);color:var(--ash);margin-top:14px;max-width:74ch}
details .body b{color:var(--craie);font-weight:500}
details .body p{margin:0 0 12px}
ul.src{list-style:none;padding:0;margin:0}
ul.src li{padding:11px 0;border-bottom:1px solid #241F19;font:400 13px/1.5 var(--body)}
ul.src a{color:var(--craie);text-decoration:none;border-bottom:1px solid var(--ash2)}
ul.src a:hover{border-color:var(--braise);color:var(--braise)}
ul.src em{display:block;font-style:normal;font:400 11.5px/1.4 var(--mono);color:var(--ash2);margin-top:3px}

footer{margin:64px 0 0;border-top:1px solid var(--soot3);padding:26px 0 60px;
  font:400 12.5px/1.65 var(--body);color:var(--ash2)}
footer .en{color:var(--ash);max-width:70ch;margin:0 0 18px}
footer a{color:var(--ash);text-decoration:underline;text-underline-offset:2px}

.leaflet-popup-content-wrapper{border-radius:2px;background:var(--craie);color:#20201C}
.leaflet-popup-tip{background:var(--craie)}
.leaflet-popup-content{font:400 13px/1.55 var(--body);margin:13px 15px}
.pop-t{font:600 16px/1.2 var(--disp);letter-spacing:-.02em;margin:0 0 3px}
.pop-m{font:400 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#6B6558;margin:0 0 9px}
.fail{padding:26px;color:#5D574A;font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="topbar" id="topbar">
  <div class="wrap topbar-in">
    <a class="brand" href="#top" id="brand"><i></i>Bleau etter brannen</a>
    <nav class="nav" id="nav">
      <a href="#kart"></a>
      <a href="#sektorer"></a>
      <a href="#logg"></a>
      <a href="#status"></a>
      <a href="#metode"></a>
      <a href="#kilder"></a>
    </nav>
    <button class="lang" id="lang" type="button"></button>
    <button class="burger" id="burger" type="button" aria-expanded="false" aria-controls="nav">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<div class="wrap">
  <div class="hero" id="top">
    <p class="kicker" id="kicker"></p>
    <h1 id="h1"></h1>
    <p class="stand" id="stand"></p>
    <p class="warn" id="warn" role="status" hidden></p>

    <div class="ratio">
      <div class="ratio-bar" id="rbar">
        <div class="ratio-burn" id="rburn"></div>
        <div class="ratio-safe" id="rsafe"></div>
      </div>
      <div class="ratio-key" id="rkey"></div>
      <p class="ratio-note" id="rnote"></p>
    </div>

    <dl class="facts" id="facts"></dl>
  </div>

  <div class="sheet" id="kart">
    <div class="sheet-top">
      <label for="prov" id="provlab"></label>
      <select id="prov"></select>
      <span id="tilestate" role="status"></span>
    </div>
    <div id="map" role="region"></div>
    <div class="picked" id="picked" tabindex="-1" aria-live="polite">
      <p class="empty"></p>
    </div>
  </div>

  <div class="filters" id="filters"></div>

  <div class="grid">
    <div>
      <h2 class="sec-h">Flatene i kartet</h2>
      <div class="shapes" id="shapelegend"></div>

const SETT='bleau-sett';

try{sistSett=localStorage.getItem(SETT);}catch(e){}
const NYESTE=HISTORIKK.reduce((a,h)=>h.d>a?h.d:a,'');

function tegnLogg(){
 const rekke=HISTORIKK.slice().sort((a,b)=>b.d.localeCompare(a.d)||b.k.localeCompare(a.k));
 el('tl').innerHTML=rekke.map(h=>{
  const ny=sistSett&&h.d>sistSett, kil=h.kilde&&SOURCES[h.kilde];
  return '<li style="--k:'+(KFARGE[h.k]||'var(--ash2)')+'">'+

     (ny?'<span class="ny">'+T.nyttMerke+'</span>':'')+'</p>'+

   '<p class="b">'+(LANG==='nb'?h.b:h.b_en)+'</p>'+
   (kil?'<a class="k" href="'+kil.u+'" target="_blank" rel="noopener">'+
     (LANG==='nb'?kil.t:kil.t_en)+' ↗</a>':'')+
   '</li>';}).join('');
}

  '<div class="shp"><span class="k '+kl[i]+'">'+(i===3?'<i class="b"></i><i></i>':'')+'</span>'+
  '<span style="font:400 12.5px/1.5 var(--body);color:var(--ash)">'+
  '<b style="display:block;color:var(--craie);font-weight:500;font-size:13px">'+s[0]+'</b>'+s[1]+'</span></div>').join('');

 el('method').innerHTML=T.method.map(p=>'<p><b>'+p[0]+'</b> '+p[1]+'</p>').join('');
 el('srclist').innerHTML=Object.values(SOURCES).map(s=>
  '<li><a href="'+s.u+'" target="_blank" rel="noopener">'+(LANG==='nb'?s.t:s.t_en)+'</a>'+
  '<em>'+(LANG==='nb'?s.d:s.d_en)+'</em></li>').join('');
 el('foot').innerHTML=T.foot;
 tegnLogg();
}

/* Forholdsbåndet animeres inn ved første maling. Bredden er den samme uansett
   språk, så den settes én gang. */
requestAnimationFrame(()=>{
  el('rburn').style.width=META.pct+'%';
  el('rsafe').style.width=(100-META.pct)+'%';
});

if(typeof L==="undefined"){
  tegnTekst();
  el('map').innerHTML='<p class="fail">'+(LANG==='nb'
    ?'Kartbiblioteket lastet ikke. Åpne siden i en vanlig nettleserfane.'
    :'The map library did not load. Open this page in an ordinary browser tab.')+'</p>';
}else{
 /* preferCanvas: 201 skogpolygoner, 76 brannflater og opptil 475 blokkprikker
    samtidig er merkbart tregt å panorere som SVG-noder på telefon. */
 const map=L.map('map',{zoomControl:true,preferCanvas:true}).setView([48.385,2.585],12);
 const stateEl=el('tilestate'),sel=el('prov');
 const provNavn=p=>LANG==='nb'?p.n:PROVNAVN[p.id];
 let layer=null,probe=null,idx=0,naaProv=PROVIDERS[0],naaTilstand=null;
 const setState=(c,t)=>{naaTilstand=[c,t];stateEl.innerHTML='<span class="dotlive" style="background:'+c+'"></span>'+t;};
 function mount(p,auto){
  if(layer){map.removeLayer(layer);layer=null;} clearTimeout(probe); naaProv=p;
  if(!p.u){setState('#6B6558',provNavn(p));return;}
  setState('#C9A227',T.prover(provNavn(p)));
  const o={maxZoom:p.max,attribution:p.at,crossOrigin:true}; if(p.sub)o.subdomains=p.sub;
  layer=L.tileLayer(p.u,o); let ok=0,feil=0,done=false;
  const giOpp=()=>{ if(done)return; done=true; clearTimeout(probe);
   if(auto){idx++; if(idx<PROVIDERS.length){sel.value=PROVIDERS[idx].id;mount(PROVIDERS[idx],true);return;}}
   setState('#C8492A',T.svarer(provNavn(p)));};
  layer.on('tileload',()=>{ok++;if(!done&&ok>=2){done=true;clearTimeout(probe);setState('#3E9B6A',provNavn(p));}});
  /* Tidligere ventet siden alltid fire sekunder. En leverandør som svarer 403
     eller 404 avslører seg med én gang, og da er det ingen grunn til å vente. */
  layer.on('tileerror',()=>{feil++;if(ok<2&&feil>=4)giOpp();});
  layer.addTo(map);
  probe=setTimeout(()=>{if(ok<2)giOpp();},4000);
 }
 function fyllProv(){
  const v=sel.value;sel.innerHTML='';
  PROVIDERS.forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=provNavn(p);sel.appendChild(o);});
  if(v)sel.value=v;
 }
 sel.addEventListener('change',()=>{idx=PROVIDERS.findIndex(x=>x.id===sel.value);mount(PROVIDERS[idx],false);});

 const forestLayer=L.layerGroup(),burnLayer=L.layerGroup(),secLayer=L.layerGroup(),
       placeLayer=L.layerGroup(),blockLayer=L.layerGroup();
 /* Popup- og tooltip-innholdet settes som funksjoner. Da leses teksten først
    når den vises, og språkbytte trenger ikke binde 277 popuper på nytt. */
 FORESTS.forEach(f=>f.rings.forEach(r=>
  L.polygon(r,{color:'#4E6B3C',weight:1.1,opacity:.9,fillColor:'#6E8C58',fillOpacity:.16,bubblingMouseEvents:false})
   .bindPopup(()=>T.skogpop(f)).addTo(forestLayer)));
 BURN_RINGS.forEach(r=>L.polygon(r,{color:'#8E2E17',weight:1,opacity:.95,fillColor:'#C8492A',fillOpacity:.62,bubblingMouseEvents:false})
  .bindPopup(()=>T.brannpop).addTo(burnLayer));
 PLACES.forEach(p=>L.marker([p.lat,p.lon],{icon:L.divIcon({className:'',html:
  '<div style="font:500 11.5px/1 var(--mono);letter-spacing:.04em;color:#2A2A24;white-space:nowrap;transform:translate(-50%,-50%);text-shadow:0 0 3px #E2DCCC,0 0 3px #E2DCCC,0 0 3px #E2DCCC">'+p.n+'</div>'})}).addTo(placeLayer));

 /* Blokkpunktene er delta-kodet for å holde sidevekta nede. Se kvantiser() i tools/beregn.py. */
 function blokker(navn){
  const p=PTS[navn]; if(!p)return[];
  const[la0,lo0,d]=p; const ut=[]; let a=0,o=0;
  for(let i=0;i<d.length;i+=2){a+=d[i];o+=d[i+1];ut.push([la0+a/1e5,lo0+o/1e5]);}
  return ut;
 }
 /* Samme kryssingstest som i tools/beregn.py. Der ble punktene projisert til meter
    først, men projeksjonen er en ren skalering av hver akse, og en slik avbildning
    endrer ikke hva som ligger innenfor — tallene blir identiske. */
 const RBOX=BURN_RINGS.map(r=>{
  let a=90,b=-90,c=180,d=-180;
  for(const p of r){if(p[0]<a)a=p[0];if(p[0]>b)b=p[0];if(p[1]<c)c=p[1];if(p[1]>d)d=p[1];}
  return[a,b,c,d];});
 function iFlate(lat,lon){
  for(let k=0;k<BURN_RINGS.length;k++){
   const q=RBOX[k];
   if(lat<q[0]||lat>q[1]||lon<q[2]||lon>q[3])continue;
   const r=BURN_RINGS[k]; let inne=false;
   for(let i=0,j=r.length-1;i<r.length;j=i++){
    const yi=r[i][0],xi=r[i][1],yj=r[j][0],xj=r[j][1];
    if((yi>lat)!==(yj>lat) && lon<(xj-xi)*(lat-yi)/(yj-yi)+xi) inne=!inne;
   }
   if(inne)return true;
  }
  return false;
 }

 const marks={},hits={};

 /* Sektorprikkene ligger tett — på telefon er nabosektoren typisk 13 piksler unna, mindre
    enn en fingertupp. Et trykk velger derfor sektoren nærmest der fingeren traff, ikke den
    prikken som tilfeldigvis ligger øverst, og treffer også et lite stykke utenfor prikken. */
 const TAP_SLACK=26;
 function selectNear(latlng,fallback){
  const pt=map.latLngToContainerPoint(latlng);
  if(fallback>=0&&!active[SECTORS[fallback].s])fallback=-1;
  let best=fallback,bd=TAP_SLACK;
  SECTORS.forEach((s,i)=>{
   if(!active[s.s])return;
   const d=pt.distanceTo(map.latLngToContainerPoint([s.lat,s.lon]));
   if(d<=bd){bd=d;best=i;}});
  if(best>=0)select(best);
 }

 SECTORS.forEach((s,i)=>{
  const m=L.circleMarker([s.lat,s.lon],{radius:s.bb>0?8:6,color:'#F7F4EB',weight:2,fillColor:CAT[s.s].c,
    fillOpacity:1,bubblingMouseEvents:false});
  m.bindTooltip(()=>T.sektip(s.n,s.bb>0?s.brent:null),{direction:'right',offset:[9,0]});
  m.on('click',e=>selectNear(e.latlng,i)); m.addTo(secLayer); marks[i]=m;});

 /* På berøringsskjerm legges en usynlig, større treffflate oppå hver prikk, slik at et
    trykk som bommer med noen piksler — eller lander på en brannflate — likevel treffer
    sektoren. Ligger de oppå hverandre, avgjør selectNear hvilken som er nærmest. */
 if(window.matchMedia('(pointer:coarse)').matches)
  SECTORS.forEach((s,i)=>{hits[i]=L.circleMarker([s.lat,s.lon],{radius:15,stroke:false,fillOpacity:.001,
    bubblingMouseEvents:false}).on('click',e=>selectNear(e.latlng,i)).addTo(secLayer);});

 map.on('click',e=>selectNear(e.latlng,-1));

 forestLayer.addTo(map);burnLayer.addTo(map);secLayer.addTo(map);blockLayer.addTo(map);
 let lagkontroll=null;
 function byggLagkontroll(){
  if(lagkontroll)map.removeControl(lagkontroll);
  const o={};
  [forestLayer,burnLayer,secLayer,blockLayer,placeLayer].forEach((l,i)=>o[T.lag[i]]=l);
  /* Utslått lagliste dekker en god del av kartet på telefon — der starter den sammenslått. */
  lagkontroll=L.control.layers(null,o,{position:'topright',
    collapsed:window.matchMedia('(max-width:760px)').matches}).addTo(map);
 }
 L.control.scale({imperial:false}).addTo(map);

 const picked=el('picked');
 let cur=-1;

 function visPicked(i){
  const s=SECTORS[i];
  picked.innerHTML=
   '<p class="pname">'+s.n+'</p>'+
   '<p class="pmeta">'+s.g+' &nbsp;·&nbsp; '+tall(s.blokk)+' '+T.blokkproblemer+'</p>'+
   '<span class="tag" style="color:'+CAT[s.s].c+'">'+ct(s.s)+'</span>'+
   (s.s!=='open'?'<span class="tag" style="color:#5D574A">'+T.stengt+'</span>':'')+
   (BOOLDER[s.n]?'<a class="blink" href="https://www.boolder.com/en/fontainebleau/'+BOOLDER[s.n]+
     '" target="_blank" rel="noopener">'+T.boolderlenke+'<span aria-hidden="true">↗</span></a>':'')+
   '<div class="pcols"><div>'+
     '<div class="gauge"><i style="width:'+Math.max(s.brent,0.8)+'%;background:'+CAT[s.s].c+'"></i></div>'+
     '<p>'+T.blokkord(s)+'</p>'+
     '<p class="dim">'+cd(s.s)+'</p>'+
   '</div><div>'+
     '<p>'+(s.skog?T.iSkog(s):T.utenforSkog)+'</p>'+
     (s.flate!==s.brent?'<p class="dim">'+T.gmlMaal(s.flate)+'</p>':'')+
     (s.iaoi?'':'<p class="dim">'+T.utenforAoi(s.avst.toFixed(2))+'</p>')+
   '</div></div>';
 }

 function select(i){
  const s=SECTORS[i];
  /* Velger man en sektor i kartet, kan raden ligge i et sammenslått område.
     Da åpnes området, ellers markeres en rad ingen ser. Dette gjelder også når
     valget skjer fra et søk: området skal stå åpent når søket tømmes. */
  if(!apne.has(s.g))settAapen(s.g,true);
  Object.keys(marks).forEach(j=>marks[j].setRadius(+j===i?11:(SECTORS[j].bb>0?8:6)));
  rowFor.forEach((r,j)=>r.setAttribute('aria-current',j===i?'true':'false'));
  cur=i;

  /* Blokkene tegnes bare for den valgte sektoren. 19 137 prikker samtidig ville
     vært både uleselig og tregt. */
  blockLayer.clearLayers();
  const pts=blokker(s.n),bounds=L.latLngBounds([]);
  pts.forEach(p=>{
   const brent=iFlate(p[0],p[1]);
   L.circleMarker(p,{radius:3,stroke:true,color:brent?'#7A5B00':'#E6E0D2',weight:1,
     fillColor:brent?BLOKK_FARGE.brent:BLOKK_FARGE.hel,fillOpacity:1,bubblingMouseEvents:false})
    .bindTooltip(()=>brent?T.blokkinne:T.blokkute,{direction:'top'})
    .addTo(blockLayer);
   bounds.extend(p);});
  /* Rammer sektoren i stedet for å sette fast zoom: da er blokkprikkene store nok
     til å skilles fra hverandre, uansett hvor liten eller stor sektoren er. */
  if(bounds.isValid())map.fitBounds(bounds.pad(.45),{maxZoom:16,animate:true});
  else map.setView([s.lat,s.lon],Math.max(map.getZoom(),13),{animate:true});

  visPicked(i);
  /* Uten animasjon: ruller siden mens fingeren er på vei ned, treffer neste trykk en
     annen rad enn den man siktet på. */
  picked.scrollIntoView({block:'nearest'});
 }

 /* ---- sektorlista: søk, sortering og statusfiltre ---- */
 const rows=el('rows'),tally=el('tally'),qEl=el('q'),sortEl=el('sortby'),alleEl=el('alle');
 const active={};Object.keys(CAT).forEach(k=>active[k]=true);
 const rowFor=new Map(),grpFor=new Map();
 /* Områdene starter sammenslåtte. Er ett åpnet, holder det seg åpent gjennom
    filtrering og språkbytte. */
 const apne=new Set();
 let gruppert=true;
 const SORT={
  brent:(a,b)=>b.s.brent-a.s.brent||a.s.avst-b.s.avst||a.s.n.localeCompare(b.s.n,'nb'),
  navn:(a,b)=>a.s.n.localeCompare(b.s.n,'nb'),
  avst:(a,b)=>a.s.avst-b.s.avst||b.s.brent-a.s.brent,
  blokk:(a,b)=>b.s.blokk-a.s.blokk||a.s.n.localeCompare(b.s.n,'nb')};

 /* Søket skal treffe «Cul de Chien» når man skriver «chien», og «Trois Pignons»
    når man skriver «trois». Diakritiske tegn strippes, så «Ségognole» finnes
    også uten aksent. */
 const norm=t=>t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');

 function lagRad(o){
  const b=document.createElement('button');b.className='row';b.dataset.s=o.s.s;b.dataset.i=o.i;
  b.setAttribute('aria-current',o.i===cur?'true':'false');
  const har=o.s.bb>0;
  b.innerHTML='<span class="dot" style="background:'+CAT[o.s.s].c+'"></span>'+
    '<span class="nm">'+o.s.n+'</span>'+
    '<span class="cnt">'+tall(o.s.bb)+' / '+tall(o.s.blokk)+'</span>'+
    '<span class="pct'+(har?'':' none')+'">'+(har?pc(o.s.brent):pc(0))+'</span>'+
    '<span class="mini"><i style="width:'+(har?Math.max(o.s.brent,3):0)+'%;background:'+CAT[o.s.s].c+'"></i></span>';
  b.setAttribute('aria-label',T.radlab(o.s.n,o.s.g,o.s.bb,o.s.blokk,ct(o.s.s)));
  b.addEventListener('click',()=>select(o.i));
  rowFor.set(o.i,b);
  return b;
 }

 function render(){
  const q=norm(qEl.value.trim()),sortKey=sortEl.value;
  rows.innerHTML='';rowFor.clear();grpFor.clear();
  let liste=SECTORS.map((s,i)=>({s,i})).filter(o=>active[o.s.s]);
  if(q)liste=liste.filter(o=>norm(o.s.n).includes(q)||norm(o.s.g).includes(q));

  gruppert=!q&&sortKey==='brent';
  if(gruppert){
   /* Standardvisningen beholder Boolders klynger, slått sammen. 90 rader på rad
      er mer enn noen leser; 19 områdeoverskrifter med sammendrag kan man skumme.
      Så snart man søker eller sorterer på noe annet, ville overskriftene stått i
      veien, og da vises lista flat. */
   const sum={};liste.forEach(o=>{const e=sum[o.s.g]||(sum[o.s.g]={bb:0,blokk:0});
    e.bb+=o.s.bb;e.blokk+=o.s.blokk;});
   /* Områdene følger samme rekkefølge som lista ellers: mest brent først.
      Alfabetisk ville Trois Pignons — det eneste området brannen traff for
      alvor — havnet nest nederst. */
   const grupper=Object.keys(sum).sort((a,b)=>
    sum[b].bb/sum[b].blokk-sum[a].bb/sum[a].blokk||a.localeCompare(b,'nb'));
   grupper.forEach((g,gi)=>{
    const del=liste.filter(o=>o.s.g===g).sort(SORT.brent);
    const blokk=del.reduce((a,o)=>a+o.s.blokk,0),bb=del.reduce((a,o)=>a+o.s.bb,0);
    const km=Math.min(...del.map(o=>o.s.avst));
    const pct=blokk?Math.round(1000*bb/blokk)/10:0;
    const id='grp-'+gi,aapen=apne.has(g);

    const h=document.createElement('button');h.className='clus';h.type='button';
    h.setAttribute('aria-expanded',String(aapen));
    h.setAttribute('aria-controls',id);
    h.innerHTML='<span class="chev" aria-hidden="true"></span>'+
      '<span class="g">'+g+'<span class="n">'+T.klSekt(del.length)+'</span></span>'+
      '<span class="sum">'+(bb>0?T.klBrent(bb,blokk,pct)+
        '<span class="cbar"><i style="width:'+Math.max(pct,2)+'%"></i></span>'
        :T.klRen(blokk,km))+'</span>';
    h.addEventListener('click',()=>settAapen(g,!apne.has(g)));
    rows.appendChild(h);

    const boks=document.createElement('div');boks.className='grp';boks.id=id;
    boks.hidden=!aapen;
    del.forEach(o=>boks.appendChild(lagRad(o)));
    rows.appendChild(boks);
    grpFor.set(g,{h,boks});});
  }else{
   liste.sort(SORT[sortKey]);
   liste.forEach(o=>rows.appendChild(lagRad(o)));
  }

  if(!liste.length)rows.innerHTML='<p class="nohit">'+T.ingen+'</p>';
  tally.textContent=gruppert?T.tallyGrp(liste.length,META.n_total,grpFor.size)
                            :T.tally(liste.length,META.n_total);
  alleEl.hidden=!gruppert||!liste.length;
  alleEl.textContent=apne.size?T.klLukk:T.klAapne;
 }

 /* Åpner eller lukker ett område. Rader i et lukket område finnes fortsatt i
    DOM-en, så aria-current og markørkoblingen holder seg. */
 function settAapen(g,paa){
  if(paa)apne.add(g); else apne.delete(g);
  const e=grpFor.get(g);
  if(e){e.boks.hidden=!paa;e.h.setAttribute('aria-expanded',String(paa));}
  alleEl.textContent=apne.size?T.klLukk:T.klAapne;
 }

 let tid=null;
 qEl.addEventListener('input',()=>{clearTimeout(tid);tid=setTimeout(render,120);});
 sortEl.addEventListener('change',render);
 alleEl.addEventListener('click',()=>{
  const lukk=apne.size>0;
  Array.from(grpFor.keys()).forEach(g=>settAapen(g,!lukk));
 });

 const fbox=el('filters');
 function byggChips(){
  fbox.innerHTML='';
  Object.keys(CAT).forEach(k=>{
   const b=document.createElement('button');b.className='chip';
   b.setAttribute('aria-pressed',String(active[k]));
   b.innerHTML='<span class="dot" style="background:'+CAT[k].c+'"></span>'+ct(k)+
     ' <span style="color:inherit;opacity:.6">'+SECTORS.filter(s=>s.s===k).length+'</span>';
   b.addEventListener('click',()=>{
    active[k]=!active[k];b.setAttribute('aria-pressed',String(active[k]));
    /* Treffflatene må følge prikkene. Ble de liggende igjen, kapret en bortfiltrert
       sektor trykk som var ment for brannflaten under. */
    SECTORS.forEach((s,i)=>{
     if(active[s.s]){marks[i].addTo(secLayer);if(hits[i])hits[i].addTo(secLayer);}
     else{secLayer.removeLayer(marks[i]);if(hits[i])secLayer.removeLayer(hits[i]);}});
    render();});
   fbox.appendChild(b);});
 }

 function tegn(){
  tegnTekst();
  fyllProv();
  byggLagkontroll();
  byggChips();
  render();
  if(cur>=0)visPicked(cur);
  if(naaTilstand&&naaProv&&!naaProv.u)setState('#6B6558',provNavn(naaProv));
 }

 el('lang').addEventListener('click',()=>{
  LANG=LANG==='nb'?'en':'nb';
  try{localStorage.setItem('lang',LANG);}catch(e){}
  const u=new URL(location);u.searchParams.set('lang',LANG);history.replaceState(null,'',u);
  tegn();
 });

 tegn();
 sel.value=PROVIDERS[0].id; mount(PROVIDERS[0],true);
}

/* Merket «nytt» skal gjelde for dette besøket, ikke forsvinne mens man leser. */
try{localStorage.setItem(SETT,NYESTE);}catch(e){}

/* ---- toppmeny ---- */
(function(){
 const bar=el('topbar'),btn=el('burger');
 const setOpen=o=>{bar.classList.toggle('open',o);btn.setAttribute('aria-expanded',String(o));};
 btn.addEventListener('click',()=>setOpen(!bar.classList.contains('open')));
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&bar.classList.contains('open')){setOpen(false);btn.focus();}});
 document.querySelectorAll('#nav a').forEach(a=>a.addEventListener('click',e=>{
  setOpen(false);
  const href=a.getAttribute('href'),t=document.querySelector(href);
  if(!t)return;
  if(t.tagName==='DETAILS')t.open=true;
  /* Myk rulling bare her, på et enkeltstående trykk — ikke som regel for hele sida,
     der den ville flyttet radene under fingeren mellom to trykk. */
  e.preventDefault();
  t.scrollIntoView({behavior:'smooth',block:'start'});
  history.replaceState(null,'',href);
 }));
})();
</script>
